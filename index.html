<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mẹ Tễu – Bé vui tách gộp 6–7</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#fff3d8,#f9e7ff);color:#392653}.wrap{max-width:690px;margin:auto;padding:18px}header{text-align:center}h1{font-size:clamp(25px,5vw,37px);margin:12px 0 5px;color:#a43b8d}.sub{margin:0 0 16px}.panel{background:white;border-radius:25px;box-shadow:0 12px 35px #b881b52b;padding:20px;margin:14px 0}.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}button,select{font:inherit;border:0;border-radius:14px;padding:12px 17px;cursor:pointer}button{background:#8e43bd;color:white;font-weight:750}button:disabled{opacity:.45}select{background:#f2e9ff;color:#3d2858}.stats{display:flex;justify-content:space-between;gap:8px;font-weight:700}.bar{height:12px;background:#eee5f5;border-radius:20px;margin:13px 0;overflow:hidden}.fill{height:100%;background:#ffad44;width:0%;transition:width .2s}.question{text-align:center;font-size:20px;font-weight:750}.tree{width:min(100%,420px);height:255px;display:block;margin:10px auto}.line{stroke:#73568d;stroke-width:5;stroke-linecap:round}.sq{fill:#fff;stroke:#8151a4;stroke-width:4}.unknown{fill:#fff1b9;stroke:#f0a12d}.num{font:bold 37px system-ui;fill:#3a2850;text-anchor:middle;dominant-baseline:middle}.hint{font-size:15px;text-align:center;color:#665677}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.answer{background:#f2e9ff;color:#573174;border:3px solid transparent;font-size:26px;min-height:66px}.answer.good{background:#d9f7d7;border-color:#4aa74c}.answer.bad{background:#ffe0df;border-color:#df6a65}.feedback{text-align:center;min-height:30px;font-weight:750;font-size:19px}.next{display:block;width:100%;background:#ef8b36}.foot{text-align:center;font-size:13px;color:#806b8b;margin:20px}.emoji{text-align:center;font-size:31px}.hidden{display:none}.end{text-align:center}label{font-weight:650}@media(max-width:380px){.wrap{padding:10px}.panel{padding:12px}.answers{gap:6px}}</style></head><body><main class="wrap"><header><div class="emoji">🌸 🧸 🌈 ⭐</div><h1>MẸ TỄU – BÉ VUI HỌC TOÁN</h1><p class="sub">Trò chơi tách – gộp trong phạm vi 6 và 7</p></header><section class="panel"><div class="controls"><label for="mode">Chọn bài:</label><select id="mode"><option value="all">Tổng hợp 80 bài</option><option value="6">Phạm vi 6 (40 bài)</option><option value="7">Phạm vi 7 (40 bài)</option></select><button id="restart">🔄 Chơi lại</button><button id="sound">🔊 Giọng đọc: Bật</button></div></section><section class="panel" id="play"><div class="stats"><span id="progress">Bài 1/80</span><span id="score">⭐ 0 điểm</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question">Điền số còn thiếu vào sơ đồ!</div><svg class="tree" viewBox="0 0 420 255" aria-label="Sơ đồ tách gộp số"><g id="diagram"></g></svg><p class="hint">👆 Chọn một số đúng ở bên dưới để điền vào ô vàng</p><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>Bài tiếp theo ➜</button></section><section class="panel end hidden" id="end"><h2>🎉 Bé hoàn thành rồi!</h2><p id="result"></p><button id="again">🌟 Chơi lại từ đầu</button></section><p class="foot">Mẹ Tễu ❤️ Cùng bé học toán mỗi ngày</p></main><script>
const $=id=>document.getElementById(id);let bank=[],index=0,score=0,locked=false,voice=true;const S='http://www.w3.org/2000/svg';function rng(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rng(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function make(n){let arr=[];for(let i=0;i<40;i++){let sum=n,first=i% (n+1),second=n-first,kind=i%2?'gop':'tach',missing=i%3===0?0:i%3===1?1:2;let vals=kind==='tach'?[sum,first,second]:[first,second,sum];let correct=vals[missing];arr.push({n,kind,vals,missing,correct})}return shuffle(arr)}function speak(t){if(!voice||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.85;window.speechSynthesis.speak(u)}function svg(tag,attrs,text){let e=document.createElementNS(S,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;$('diagram').appendChild(e);return e}function draw(q){$('diagram').innerHTML='';let top=q.kind==='tach';let points=top?[[210,54],[112,190],[308,190]]:[[112,54],[308,54],[210,190]];let edges=top?[[210,83,112,155],[210,83,308,155]]:[[112,83,210,155],[308,83,210,155]];edges.forEach(e=>svg('line',{x1:e[0],y1:e[1],x2:e[2],y2:e[3],class:'line'}));points.forEach(([x,y],i)=>{svg('rect',{x:x-39,y:y-33,width:78,height:66,rx:12,class:'sq '+(q.missing===i?'unknown':'')});svg('text',{x,y:y+2,class:'num'},q.missing===i?'?':q.vals[i])})}function options(correct,n){let vals=[correct],others=shuffle(Array.from({length:n+1},(_,i)=>i).filter(x=>x!==correct));return shuffle(vals.concat(others.slice(0,3)))}function render(){let q=bank[index];locked=false;$('progress').textContent=`Bài ${index+1}/${bank.length}`;$('score').textContent=`⭐ ${score} điểm`;$('fill').style.width=(index/bank.length*100)+'%';$('question').textContent=q.kind==='tach'?`Tách số ${q.n}: Số nào còn thiếu?`:`Gộp các số: Điền số còn thiếu!`;draw(q);$('answers').innerHTML='';options(q.correct,q.n).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>choose(v,b);$('answers').appendChild(b)});$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===bank.length-1?'Xem kết quả 🎉':'Bài tiếp theo ➜';speak(q.kind==='tach'?`Bé hãy tách số ${q.n}. Số nào còn thiếu?`:'Bé hãy gộp các số. Số nào còn thiếu?')}function choose(v,b){if(locked)return;let q=bank[index];if(v===q.correct){locked=true;score++;b.classList.add('good');$('feedback').textContent='🎉 Chính xác! Bé giỏi quá!';$('next').disabled=false;$('score').textContent=`⭐ ${score} điểm`;speak('Chính xác! Bé giỏi quá!')}else{b.classList.add('bad');b.disabled=true;$('feedback').textContent='💗 Bé thử lại nhé!';speak('Bé thử lại nhé!')}}function start(){let m=$('mode').value;bank=m==='all'?shuffle([...make(6),...make(7)]):make(+m);index=0;score=0;$('end').classList.add('hidden');$('play').classList.remove('hidden');render()}$('next').onclick=()=>{if(index+1<bank.length){index++;render()}else{$('play').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent=`Bé đã trả lời đúng ${score}/${bank.length} bài!` ;speak('Chúc mừng bé đã hoàn thành trò chơi!')}};$('restart').onclick=start;$('again').onclick=start;$('mode').onchange=start;$('sound').onclick=()=>{voice=!voice;$('sound').textContent=voice?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!voice&&'speechSynthesis'in window)window.speechSynthesis.cancel()};start();</script></body></html>
